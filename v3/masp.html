<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mapa Mundial - Exportación</title>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #07180e;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           MAPA
        ====================================================== */

        #map {

            width: 100%;

            height: 100vh;

            min-height: 100vh;

            background: #07180e;
        }


        .leaflet-container {

            width: 100%;

            height: 100vh;

            background: #07180e;
        }


        /* =====================================================
           QUITAR CONTROLES
        ====================================================== */

        .leaflet-control-zoom {

            display: none;
        }


        .leaflet-control-attribution {

            display: none;
        }


        /* =====================================================
           PAÍSES
        ====================================================== */

        .pais-normal {

            fill: #284d31;

            fill-opacity: .85;

            color: #122818;

            transition:
                fill .3s ease,
                fill-opacity .3s ease;
        }


        .pais-importante {

            fill: #496f45;

            fill-opacity: 1;

            color: #fff4a3;
        }


        .leaflet-interactive {

            cursor: pointer !important;
        }


        /* =====================================================
           MARCADOR DE PAÍS
        ====================================================== */

        .marcador-pais {

            width: 16px;

            height: 16px;

            background: #fff4a3;

            border: 3px solid white;

            border-radius: 50%;

            box-shadow:
                0 0 8px #fff4a3,
                0 0 20px #fff4a3;

            position: relative;

            cursor: pointer;
        }


        .marcador-pais::after {

            content: "";

            position: absolute;

            width: 34px;

            height: 34px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            border:
                2px solid #fff4a3;

            border-radius: 50%;

            animation:
                pulso 2s infinite;
        }


        /* =====================================================
           MARCADOR ORIGEN
        ====================================================== */

        .marcador-origen {

            width: 18px;

            height: 18px;

            background: #e2d36e;

            border: 3px solid white;

            border-radius: 50%;

            box-shadow:
                0 0 10px #fff4a3,
                0 0 25px #fff4a3;

            position: relative;
        }


        .marcador-origen::after {

            content: "";

            position: absolute;

            width: 38px;

            height: 38px;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            border:
                2px solid #fff4a3;

            border-radius: 50%;

            animation:
                pulso 2s infinite;
        }


        /* =====================================================
           ANIMACIÓN
        ====================================================== */

        @keyframes pulso {

            0% {

                transform:
                    translate(-50%, -50%)
                    scale(.5);

                opacity: 1;
            }

            100% {

                transform:
                    translate(-50%, -50%)
                    scale(1.7);

                opacity: 0;
            }
        }


        /* =====================================================
           RUTAS
        ====================================================== */

        .ruta-comercial {

            pointer-events: none;

            filter:
                drop-shadow(
                    0 0 2px
                    rgba(255,255,255,.45)
                );
        }


        /* =====================================================
           PANEL
        ====================================================== */

        #panel {

            position: fixed !important;

            top: 410px !important;

            left: 250px !important;

            right: auto !important;

            bottom: auto !important;


            width: 180px !important;

            min-width: 180px !important;

            max-width: 180px !important;


            height: 90px !important;

            min-height: 90px !important;

            max-height: 90px !important;


            transform:
                translate(-50%, -50%)
                scale(.92) !important;


            padding: 15px !important;


            background:
                rgba(5, 25, 13, .97) !important;

            border:
                1px solid
                rgba(255,244,163,.55) !important;

            border-radius:
                15px !important;


            box-sizing:
                border-box !important;

            overflow:
                hidden !important;


            z-index:
                9999 !important;


            box-shadow:
                0 10px 35px
                rgba(0,0,0,.55);

            backdrop-filter:
                blur(8px);


            opacity: 0;

            visibility: hidden;


            transition:
                opacity .3s ease,
                transform .3s ease,
                visibility .3s ease;
        }


        /* =====================================================
           PANEL VISIBLE
        ====================================================== */

        #panel.visible {

            opacity: 1 !important;

            visibility:
                visible !important;

            transform:
                translate(-50%, -50%)
                scale(1) !important;
        }


        /* =====================================================
           CABECERA
        ====================================================== */

        #panel .panel-cabecera {

            display: flex;

            align-items: center;

            gap: 10px;

            margin-top: 5px;

            padding-right: 28px;
        }


        /* =====================================================
           BANDERA
        ====================================================== */

        #panel .bandera {

            font-size: 30px;

            line-height: 1;

            min-width: 35px;
        }


        /* =====================================================
           NOMBRE
        ====================================================== */

        #panel h2 {

            color: #fff4a3 !important;

            font-size: 18px !important;

            line-height: 1.1 !important;

            margin:
                0 0 5px 0 !important;

            font-weight: bold;
        }


        /* =====================================================
           CÓDIGO
        ====================================================== */

        #panel .codigo-pais {

            color: #ffffff;

            font-size: 13px;

            font-weight: bold;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =====================================================
           BOTÓN CERRAR
        ====================================================== */

        #panel .cerrar {

            position: absolute;

            top: 7px;

            right: 7px;

            width: 25px;

            height: 25px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background:
                rgba(255,255,255,.08);

            color: white;

            font-size: 16px;

            line-height: 25px;

            text-align: center;

            cursor: pointer;

            z-index: 20;
        }


        #panel .cerrar:hover {

            background:
                rgba(255,244,163,.2);

            color: #fff4a3;
        }


        /* =====================================================
           ETIQUETA ORIGEN
        ====================================================== */

        .etiqueta-origen {

            background:
                rgba(5,25,13,.94);

            color: #fff4a3;

            border:
                1px solid
                rgba(255,244,163,.5);

            border-radius: 7px;

            padding:
                6px 9px;

            font-size: 11px;

            font-weight: bold;
        }


        /* =====================================================
           BOTÓN MAPA
        ====================================================== */

        .btn-mapa-icono {

            position: fixed;

            right: 20px;

            bottom: 20px;

            width: 48px;

            height: 48px;

            z-index: 5000;

            display: flex;

            align-items: center;

            justify-content: center;

            border:
                1px solid
                rgba(255,244,163,.45);

            border-radius: 50%;

            background:
                rgba(5,28,15,.92);

            color: #fff4a3;

            font-size: 20px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            box-shadow:
                0 5px 20px
                rgba(0,0,0,.35);
        }


        /* =====================================================
           MÓVIL
        ====================================================== */

        @media (max-width: 700px) {

            #map {

                height: 100vh;

                min-height: 100vh;
            }


            .leaflet-container {

                height: 100vh;
            }


            #panel {

                width:
                    180px !important;

                min-width:
                    180px !important;

                max-width:
                    180px !important;

                height:
                    90px !important;

                min-height:
                    90px !important;

                max-height:
                    90px !important;
            }


            #panel h2 {

                font-size:
                    17px !important;
            }


            #panel .bandera {

                font-size:
                    28px;
            }
        }


        /* =====================================================
           MÓVIL PEQUEÑO
        ====================================================== */

        @media (max-width: 450px) {

            #map {

                height: 100vh;

                min-height: 100vh;
            }


            .leaflet-container {

                height: 100vh;
            }


            #panel {

                width:
                    170px !important;

                min-width:
                    170px !important;

                max-width:
                    170px !important;

                height:
                    85px !important;

                min-height:
                    85px !important;

                max-height:
                    85px !important;
            }


            #panel h2 {

                font-size:
                    16px !important;
            }


            #panel .bandera {

                font-size:
                    26px;
            }


            #panel .codigo-pais {

                font-size:
                    12px;
            }
        }

    
        /* AJUSTE FINAL DE ZOOM Y TAMAÑO DEL MAPA */
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        #map,
        .leaflet-container {
            width: 100%;
            height: 100vh !important;
            min-height: 100vh !important;
        }

    </style>

</head>


<body>


<!-- =====================================================
     MAPA
====================================================== -->

<div id="map"></div>


<!-- =====================================================
     PANEL
====================================================== -->

<div
    id="panel"
    class="panel"
>

    <button
        class="cerrar"
        onclick="cerrarPanel()"
        aria-label="Cerrar"
    >
        ×
    </button>


    <div class="panel-cabecera">

        <div
            class="bandera"
            id="bandera"
        ></div>


        <div>

            <h2 id="nombre">
                País
            </h2>


            <div
                class="codigo-pais"
                id="codigo"
            >
                XX
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     LEAFLET
====================================================== -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

/* =====================================================
   CREAR MAPA
===================================================== */

const mapa = L.map(
    "map",
    {
        zoomControl: false,

        minZoom: 1.5,

        maxZoom: 7,

        worldCopyJump: false,

        zoomSnap: 0.1,

        zoomDelta: 0.5
    }
);


/* =====================================================
   DATOS DE PAÍSES
===================================================== */

const paises = {

    "Germany": {

        nombre: "Alemania",

        bandera: "🇩🇪",

        codigo: "DE",

        coordenadas: [
            51.1657,
            10.4515
        ]

    },


    "Netherlands": {

        nombre: "Países Bajos",

        bandera: "🇳🇱",

        codigo: "NL",

        coordenadas: [
            52.1326,
            5.2913
        ]

    },


    "Belgium": {

        nombre: "Bélgica",

        bandera: "🇧🇪",

        codigo: "BE",

        coordenadas: [
            50.8503,
            4.3517
        ]

    },


    "Switzerland": {

        nombre: "Suiza",

        bandera: "🇨🇭",

        codigo: "CH",

        coordenadas: [
            46.8182,
            8.2275
        ]

    },


    "United States of America": {

        nombre: "Estados Unidos",

        bandera: "🇺🇸",

        codigo: "US",

        coordenadas: [
            39.8283,
            -98.5795
        ]

    }

};


/* =====================================================
   ORIGEN (usado en varias funciones)
===================================================== */

const ORIGEN = [
    -11.5,
    -75.5
];


/* =====================================================
   GEOJSON
===================================================== */

const geojsonURL =
    "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";


/* =====================================================
   VARIABLES
===================================================== */

let capasPaises = {};

let marcadores = {};


/* =====================================================
   VISTA INICIAL
   (provisional, se recalcula con fitBounds al cargar)
===================================================== */

mapa.setView(
    [20, -30],
    2
);


/* =====================================================
   OBTENER NOMBRE DEL PAÍS
===================================================== */

function obtenerNombrePais(feature) {

    return (
        feature.properties.ADMIN ||
        feature.properties.NAME ||
        feature.properties.name ||
        ""
    );

}


/* =====================================================
   ESTILO PAÍSES
===================================================== */

function estiloPais(feature) {

    const nombre =
        obtenerNombrePais(feature);


    if (paises[nombre]) {

        return {

            fillColor:
                "#496f45",

            fillOpacity:
                1,

            color:
                "#fff0a0",

            weight:
                1.8

        };

    }


    return {

        fillColor:
            "#284d31",

        fillOpacity:
            .85,

        color:
            "#122818",

        weight:
            .7

    };

}


/* =====================================================
   CARGAR MAPA
===================================================== */

fetch(geojsonURL)

.then(
    respuesta =>
        respuesta.json()
)

.then(
    datos => {

        L.geoJSON(

            datos,

            {

                style:
                    estiloPais,


                onEachFeature:
                    function(
                        feature,
                        capa
                    ) {

                        const nombre =
                            obtenerNombrePais(
                                feature
                            );


                        if (
                            paises[nombre]
                        ) {

                            capasPaises[
                                nombre
                            ] = capa;


                            capa.on({

                                mouseover:
                                    function() {

                                        capa.setStyle({

                                            fillColor:
                                                "#769352",

                                            fillOpacity:
                                                1,

                                            weight:
                                                2.5

                                        });

                                    },


                                mouseout:
                                    function() {

                                        capa.setStyle(
                                            estiloPais(
                                                feature
                                            )
                                        );

                                    },


                                click:
                                    function() {

                                        seleccionarPais(

                                            capa,

                                            paises[
                                                nombre
                                            ]

                                        );

                                    }

                            });

                        }

                    }

            }

        ).addTo(mapa);


        /* =================================================
           RUTAS
        ================================================= */

        crearTodasLasRutas();


        /* =================================================
           MARCADORES
        ================================================= */

        crearMarcador(
            51.1657,
            10.4515,
            "Germany"
        );


        crearMarcador(
            52.1326,
            5.2913,
            "Netherlands"
        );


        crearMarcador(
            50.8503,
            4.3517,
            "Belgium"
        );


        crearMarcador(
            46.8182,
            8.2275,
            "Switzerland"
        );


        crearMarcador(
            39.8283,
            -98.5795,
            "United States of America"
        );


        /* =================================================
           ORIGEN
        ================================================= */

        crearMarcadorOrigen();


        /* =================================================
           VISTA
        ================================================= */

        setTimeout(
            function() {

                mapa.invalidateSize();

                mostrarTodosLosDestinos();

            },
            300
        );

    }
)

.catch(
    error => {

        console.error(
            "Error cargando el mapa:",
            error
        );

    }
);


/* =====================================================
   CREAR RUTAS
===================================================== */

function crearTodasLasRutas() {

    crearRutaCurva(
        ORIGEN,
        [
            39.8283,
            -98.5795
        ],
        12
    );


    crearRutaCurva(
        ORIGEN,
        [
            51.1657,
            10.4515
        ],
        18
    );


    crearRutaCurva(
        ORIGEN,
        [
            52.1326,
            5.2913
        ],
        24
    );


    crearRutaCurva(
        ORIGEN,
        [
            50.8503,
            4.3517
        ],
        9
    );


    crearRutaCurva(
        ORIGEN,
        [
            46.8182,
            8.2275
        ],
        2
    );

}


/* =====================================================
   RUTA CURVA
===================================================== */

function crearRutaCurva(
    origen,
    destino,
    altura
) {

    const puntos = [];


    const lat1 =
        origen[0];

    const lng1 =
        origen[1];


    const lat2 =
        destino[0];

    const lng2 =
        destino[1];


    const latControl =
        (lat1 + lat2) / 2
        +
        altura;


    const lngControl =
        (lng1 + lng2) / 2;


    for (
        let i = 0;
        i <= 100;
        i++
    ) {

        const t =
            i / 100;


        const lat =

            Math.pow(
                1 - t,
                2
            ) * lat1

            +

            2 *
            (1 - t) *
            t *
            latControl

            +

            Math.pow(
                t,
                2
            ) * lat2;


        const lng =

            Math.pow(
                1 - t,
                2
            ) * lng1

            +

            2 *
            (1 - t) *
            t *
            lngControl

            +

            Math.pow(
                t,
                2
            ) * lng2;


        puntos.push([
            lat,
            lng
        ]);

    }


    L.polyline(

        puntos,

        {

            className:
                "ruta-comercial",

            color:
                "#fff4d0",

            weight:
                2,

            opacity:
                .85,

            dashArray:
                "7,7",

            lineCap:
                "round",

            lineJoin:
                "round",

            interactive:
                false

        }

    ).addTo(mapa);

}


/* =====================================================
   MARCADOR DE PAÍS
===================================================== */

function crearMarcador(
    lat,
    lng,
    clave
) {

    const datos =
        paises[clave];


    const icono =
        L.divIcon({

            className: "",

            html:
                `<div
                    class="marcador-pais"
                    title="${datos.nombre}">
                </div>`,

            iconSize:
                [16, 16],

            iconAnchor:
                [8, 8]

        });


    const marcador =
        L.marker(

            [
                lat,
                lng
            ],

            {

                icon:
                    icono,

                zIndexOffset:
                    1000

            }

        ).addTo(mapa);


    marcadores[clave] =
        marcador;


    marcador.on(

        "click",

        function() {

            seleccionarPais(

                marcador,

                datos,

                [
                    lat,
                    lng
                ]

            );

        }

    );

}


/* =====================================================
   MARCADOR ORIGEN
===================================================== */

function crearMarcadorOrigen() {

    const icono =
        L.divIcon({

            className: "",

            html:
                `<div
                    class="marcador-origen"
                    title="Junín - Perú">
                </div>`,

            iconSize:
                [18, 18],

            iconAnchor:
                [9, 9]

        });


    const marcador =
        L.marker(

            ORIGEN,

            {

                icon:
                    icono,

                interactive:
                    false,

                zIndexOffset:
                    900

            }

        ).addTo(mapa);


    marcador.bindTooltip(

        "Origen: Junín, Perú",

        {

            permanent:
                true,

            direction:
                "right",

            offset:
                [10, 0],

            className:
                "etiqueta-origen"

        }

    );

}


/* =====================================================
   MOSTRAR TODOS LOS DESTINOS
   (ahora usa fitBounds en vez de un zoom fijo,
   así siempre se ve todo el conjunto de puntos
   con margen, sin importar el tamaño de pantalla)
===================================================== */

function mostrarTodosLosDestinos() {

    /* =================================================
       Vista fija (en vez de fitBounds dinámico).

       fitBounds recalculaba el zoom según el tamaño
       exacto del contenedor en cada carga, por eso
       el resultado variaba (a veces con más espacio
       arriba, a veces con menos). Con un centro y
       zoom fijos, la vista siempre es la misma,
       calculada para coincidir con la vista aprobada.
    ================================================= */

    mapa.setView(

        [28, -35],

        1.8,

        {
            animate: false
        }

    );


    setTimeout(

        function() {

            mapa.invalidateSize();

        },

        100

    );

}


/* =====================================================
   SELECCIONAR PAÍS
===================================================== */

function seleccionarPais(

    elemento,

    datos,

    coordenadas = null

) {

    /* =================================================
       BANDERA
    ================================================= */

    document
        .getElementById("bandera")
        .textContent =
        datos.bandera;


    /* =================================================
       NOMBRE
    ================================================= */

    document
        .getElementById("nombre")
        .textContent =
        datos.nombre;


    /* =================================================
       CÓDIGO
    ================================================= */

    document
        .getElementById("codigo")
        .textContent =
        datos.codigo;


    /* =================================================
       ABRIR PANEL
    ================================================= */

    document
        .getElementById("panel")
        .classList
        .add("visible");


    /* =================================================
       CLICK SOBRE PAÍS
    ================================================= */

    if (
        elemento instanceof L.Polygon
    ) {

        mapa.flyToBounds(

            elemento.getBounds(),

            {

                paddingTopLeft:
                    [40, 40],

                paddingBottomRight:
                    [40, 40],

                maxZoom:
                    4,

                duration:
                    1.2

            }

        );

    }


    /* =================================================
       CLICK SOBRE MARCADOR
    ================================================= */

    else if (
        coordenadas
    ) {

        mapa.flyTo(

            coordenadas,

            4,

            {

                duration:
                    1.2

            }

        );

    }

}


/* =====================================================
   CERRAR PANEL
===================================================== */

function cerrarPanel() {

    document
        .getElementById("panel")
        .classList
        .remove("visible");


    setTimeout(

        function() {

            mapa.invalidateSize();

            mostrarTodosLosDestinos();

        },

        350

    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(

    "resize",

    function() {

        setTimeout(

            function() {

                mapa.invalidateSize();

                mostrarTodosLosDestinos();

            },

            100

        );

    }

);


/* =====================================================
   LOAD
===================================================== */

window.addEventListener(

    "load",

    function() {

        setTimeout(

            function() {

                mapa.invalidateSize();

                mostrarTodosLosDestinos();

            },

            400

        );

    }

);

</script>


</body>

</html>
